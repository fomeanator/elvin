# Mirror packages: on every version tag (v*), split each UPM package's
# subdirectory history and push it to its read-only mirror repo. Consumers
# install from the mirrors (a few-MB clone) instead of this monorepo (~300 MB
# of demo content — UPM clones the WHOLE repo before applying ?path=).
# The monorepo stays the only place development happens; mirrors are outputs.
#
# MIRROR_TOKEN is a PAT with repo scope that can push to the fomeanator/lvn-*
# mirror repositories.
name: Mirror packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    name: split & push mirrors
    if: github.repository == 'fomeanator/elvin'
    runs-on: [self-hosted, unity-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # subtree split needs the full history

      - name: split each package and push to its mirror
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          fail=0
          # СПИСОК НЕ ЗАХАРДКОЖЕН — по тому же правилу, что у пакетов языка
          # ниже: новый пакет это новый каталог unity/Packages/com.lvn.*, и он
          # публикуется сам. Пять пар «пакет:репо» стояли здесь руками, и шестой
          # пришлось бы вписать — а забыть легко: публикация идёт по тегу, редко,
          # и молча пропустила бы пакет, которого нет в списке.
          #
          # Имя зеркала выводится из имени пакета (com.lvn.engine.shell →
          # lvn-engine-shell). Соответствие имён проверяет
          # TestPackageMirrorNames — на каждом пуше, а не по тегу: ошибка в
          # публикации обнаруживается за минуту, а не при выпуске версии.
          shopt -s nullglob
          for dir in unity/Packages/com.lvn.*/; do
            pkg="$(basename "$dir")"
            # com.lvn.engine.shell → lvn-engine-shell
            repo="${pkg#com.}"; repo="${repo//./-}"
            head=$(git subtree split -P "unity/Packages/$pkg")
            echo "$pkg → $repo @ $head"
            url="https://x-access-token:${TOKEN}@github.com/fomeanator/${repo}.git"
            ok=""
            # the runner's DNS flaps — retry each push a few times
            for i in 1 2 3 4 5; do
              if git -c http.version=HTTP/1.1 push --force "$url" \
                   "${head}:refs/heads/main" "${head}:refs/tags/${TAG}"; then
                ok=1; break
              fi
              echo "  push to $repo failed (attempt $i), retrying…"; sleep 15
            done
            [ -n "$ok" ] || { echo "::error::mirror push failed: $repo"; fail=1; }
          done
          exit $fail

      - name: split each .lvns package and push to its mirror
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          # Пакеты языка (docs/packages.md) зеркалятся тем же способом, что и
          # UPM-пакеты, но список НЕ захардкожен: новый пакет — это новый
          # каталог packages/<repo>/lvns.package.json, и он публикуется сам.
          # Имя репо-зеркала = имя каталога; ссылка потребителя —
          # github:fomeanator/<repo>@<тег>, а тег двигает этот же пуш.
          TAG="${GITHUB_REF_NAME}"
          fail=0
          shopt -s nullglob
          for manifest in packages/*/lvns.package.json; do
            dir="$(dirname "$manifest")"; repo="$(basename "$dir")"
            head=$(git subtree split -P "$dir")
            echo "$dir → $repo @ $head"
            url="https://x-access-token:${TOKEN}@github.com/fomeanator/${repo}.git"
            ok=""
            for i in 1 2 3 4 5; do
              if git -c http.version=HTTP/1.1 push --force "$url" \
                   "${head}:refs/heads/main" "${head}:refs/tags/${TAG}"; then
                ok=1; break
              fi
              echo "  push to $repo failed (attempt $i), retrying…"; sleep 15
            done
            [ -n "$ok" ] || { echo "::error::lvns mirror push failed: $repo"; fail=1; }
          done
          exit $fail
