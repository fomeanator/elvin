# The invariant net: everything the repo asserts about itself, run on every
# push/PR instead of on somebody's machine.
#
#   go     — server + lvnconv (importer/validator/adpd) tests, vet, gofmt.
#            Здесь же живут стражи формы кода: дословные дубли, почти-копии,
#            молчаливые catch и фоновые задачи без присмотра — они читают C#
#            движка и падают, если код возвращается к прежним привычкам.
#            Includes the docs contract (lvn/docs_contract_test.go): CAPABILITIES.md
#            §1 == KnownOps, no self-contradiction, and nothing marked ✅ without an
#            example the smoke job below compiles.
#            The importer e2e over real articy projects is env-gated
#            (ARTICY_PROJECTS) and self-skips here — those projects are private.
#   smoke  — lvnconv end-to-end on the committed example (convert → validate).
#   lang   — the LVNScript grammar contract: lvn-lang tests (incl. the
#            grammar.json ↔ grammar.js parity guard) + a regen-diff check so a
#            hand-edited generated file fails loudly.
#   panel  — the authoring panel builds (catches broken imports/aliases).
#   unity  — the engine package's EditMode suite + the PlayMode smoke via
#            game-ci, using the committed unity/TestHost project. Needs either
#            the UNITY_EMAIL + UNITY_PASSWORD secrets (Personal license — Unity
#            dropped manual .ulf activation for it) or a UNITY_LICENSE .ulf
#            (Pro). Without credentials the job emits a notice and passes, so
#            forks stay green until configured.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "ui/**", "refactor/**"]
  pull_request:
  schedule:
    # Ночной прогон стабильности (qa/stability.sh на self-hosted раннере):
    # 02:30 UTC — mac свободен, ловим флейки «раз на 10 отваливается».
    - cron: "30 2 * * *"

# Each Go module is built and tested standalone (GOWORK=off), the way a
# consumer would `go install` it — the repo's go.work is a local convenience,
# not part of the contract.
env:
  GOWORK: "off"

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [tools/lvnconv, server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # node нужен НЕ для сборки, а для трёх стражей языка: браузерный
      # вычислитель и мини-плеер playground прогоняются через conformance, а
      # упаковка экспорта проверяется на тождество исходникам. Без node эти
      # тесты честно пропускаются (t.Skip) — то есть на машине без него молчат.
      # Молчащий на CI страж создаёт ровно ту уверенность, ради борьбы с которой
      # он заведён, поэтому node ставится здесь наравне с Go.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        # LVN_REQUIRE_NODE: здесь node ЕСТЬ, поэтому стражам языка запрещено
        # пропускаться. Без этой переменной их молчание неотличимо от прохода —
        # именно так три стража браузерного тракта не работали на CI вовсе.
        env:
          LVN_REQUIRE_NODE: "1"
        # -count=1: стражи читают дерево репозитория (C#, JS, манифесты), а кэш
        # go test считает входами только .go-файлы и молча отдаёт «ok».
        run: go test -count=1 ./...

  smoke:
    name: lvnconv end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lvnconv/go.mod
          cache-dependency-path: tools/lvnconv/go.sum
      - name: convert + validate the example
        working-directory: tools/lvnconv
        run: |
          go run . convert -i ../../examples/hello.ink -o /tmp/hello.lvn
          go run . validate /tmp/hello.lvn
          go run . probe /tmp/hello.lvn
      # The howto quality gate the docs promise: every authored example
      # compiles AND validates with zero warnings — examples can't rot.
      #
      # Гейт ЖИВЁТ В qa/lvns-gate.sh, а не здесь. Прежняя редакция стояла
      # прямо в этом файле и сверяла ТЕКСТ вывода валидатора с образцом
      # " 0 warning(s)". На битом скрипте валидатор печатает
      # "FAIL: 1 error(s), 0 warning(s)" — образцу удовлетворяет, и ошибка
      # проходила насквозь; код возврата при этом терялся в $(…). Замерено:
      # глава с опечаткой в имени команды проходила гейт целиком.
      # Скрипт судит по КОДУ ВОЗВРАТА и умеет падать: -selftest подкладывает
      # ту самую опечатку и требует отказа.
      - name: compile-gate every authored example (howto + examples)
        run: |
          qa/lvns-gate.sh -selftest
          qa/lvns-gate.sh

  lang:
    name: LVNScript grammar contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: grammar + analysis tests
        working-directory: tools/lvn-lang
        run: node --test
      - name: generated grammar.js is in sync
        working-directory: tools/lvn-lang
        run: |
          node scripts/gen.mjs
          git diff --exit-code src/grammar.js \
            || { echo "::error::grammar.js is stale — run 'npm run gen' in tools/lvn-lang and commit"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lvnconv/go.mod
      # Мёртвый контент — то, что валидатор пропускает по построению: ссылки
      # целы, ops известны, а пути к куску скрипта всё равно нет. Обход играет
      # ВСЕ ветки и валит сборку, если в примерах появилась недостижимая
      # логика. На живом контенте так нашлись три места, где код есть, а игра
      # его никогда не исполняла (см. tools/lvnconv/cmd_walk.go).
      - name: no unreachable content in shipped .lvns
        run: |
          # mapfile, а не $(…) без кавычек: пути с пробелами обязаны доехать
          # одним аргументом каждый, иначе обход молча получит мусор вместо
          # файлов и сборка будет «зелёной» ни на чём.
          #
          # quotePath=false ОБЯЗАТЕЛЕН: по умолчанию git экранирует не-ASCII
          # имена восьмеричными последовательностями, и обход получает путь,
          # которого на диске нет. Он честно отвечает «НЕ РАЗОБРАН», выходит
          # единицей — а строка ниже объявляет это «недостижимым контентом».
          # Сообщение, врущее про причину, дороже самой поломки; ровно об этом
          # предупреждает соседний комментарий. Репозиторий это уже проходил:
          # см. тот же флаг в qa/run-all.sh.
          mapfile -t files < <(git -c core.quotePath=false ls-files '*.lvns')
          [ ${#files[@]} -gt 0 ] || { echo "::error::в репозитории не нашлось ни одного .lvns"; exit 1; }

          # Сборка и обход — РАЗНЫЕ шаги по смыслу, и путать их нельзя: первый
          # прогон в CI упал на сборке, а сообщение отчиталось «найден
          # недостижимый контент». Ошибка, которая врёт про причину, дороже
          # самой поломки. GOWORK=off — собираем один модуль по его go.sum, а
          # не воркспейс с общим go.work.sum, которого в чистой машине может не
          # хватить.
          ( cd tools/lvnconv && GOWORK=off go build -o "$RUNNER_TEMP/lvnconv" . ) \
            || { echo "::error::lvnconv не собрался — это поломка сборки, а не контента"; exit 1; }

          echo "обход ${#files[@]} файлов"
          "$RUNNER_TEMP/lvnconv" walk -strict "${files[@]}" \
            || { echo "::error::найден недостижимый контент — см. вывод выше (lvnconv walk)"; exit 1; }

  panel:
    name: authoring panel builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lvnconv/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: build + lint + test
        working-directory: panel
        run: |
          npm ci
          npm run build
          npm run lint
          npm test

  # Runs on the self-hosted mac runner: Unity is installed and licensed there
  # (Unity discontinued .ulf activation for Personal licenses, so the docker
  # route can't activate). Push-only + repo guard: pull requests from forks
  # must never execute on our hardware.
  unity:
    name: engine tests (EditMode + PlayMode)
    if: github.event_name == 'push' && github.repository == 'fomeanator/elvin'
    runs-on: [self-hosted, unity-mac]
    timeout-minutes: 40
    env:
      UNITY: /Applications/Unity/Hub/Editor/6000.4.5f1/Unity.app/Contents/MacOS/Unity
    steps:
      - uses: actions/checkout@v4
      # The PlayMode boot smoke drives NovelApp against a REAL server (boot veil,
      # HTTP stack, UI Toolkit — the layer EditMode cannot see). It self-skips
      # without this binary, and nothing in CI ever built it: the job's own header
      # advertised "the PlayMode smoke" while the only test of the async boot
      # pipeline had never run outside a developer's laptop. A skip counts as
      # green in the report step, so the gap was invisible.
      - name: build the test server (PlayMode boot smoke needs it)
        # Built from INSIDE the module: this workflow sets GOWORK=off globally,
        # and the repo root has no go.mod of its own — `go build ./server` from
        # the root fails with "cannot find main module". go.work is a local
        # convenience, not part of the contract (see the env note at the top).
        working-directory: server
        run: go build -o "$GITHUB_WORKSPACE/qa/bin/lvnserver-test" .
      - name: EditMode
        run: |
          "$UNITY" -batchmode -nographics -projectPath unity/TestHost \
            -runTests -testPlatform EditMode \
            -testResults "$PWD/test-results/editmode.xml" -logFile - | tail -20 || true
          test -s test-results/editmode.xml
      - name: PlayMode
        run: |
          "$UNITY" -batchmode -nographics -projectPath unity/TestHost \
            -runTests -testPlatform PlayMode \
            -testResults "$PWD/test-results/playmode.xml" -logFile - | tail -20 || true
          test -s test-results/playmode.xml
      - name: report
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sorted(glob.glob('test-results/*.xml')):
              r = ET.parse(f).getroot()
              print(f"{f}: total={r.get('total')} passed={r.get('passed')} "
                    f"failed={r.get('failed')} skipped={r.get('skipped')}")
              for tc in r.iter('test-case'):
                  # Skipped is legitimate on this runner's clean checkout: the
                  # soak bot ignores itself without partner content, the boot
                  # smoke without qa/bin/lvnserver-test. Only real reds gate.
                  if tc.get('result') not in ('Passed', 'Skipped'):
                      bad += 1
                      print('  FAIL:', tc.get('fullname'))
          sys.exit(1 if bad else 0)
          PY
      # The artifact is diagnostics, not the gate — the report step above already
      # failed the job on any red test. Uploads regularly time out on this
      # runner's flaky link to GitHub; that must not repaint a green run red.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: unity-test-results
          path: test-results

  # E2 лестницы автоматизации: ночной прогон стабильности. Гоняет полный
  # EditMode-набор 5 раз с РАЗНЫМИ сидами соука (LVN_SOAK_SEED_BASE=1000*i)
  # и сводит «тест → падений из N»: падает всегда = баг, иногда = ФЛЕЙК.
  # Только по расписанию и только на нашем железе.
  nightly-stability:
    if: github.event_name == 'schedule' && github.repository == 'fomeanator/elvin'
    runs-on: [self-hosted, unity-mac]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: stability x5
        run: ./qa/stability.sh 5
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: nightly-stability-reports
          path: qa/reports
